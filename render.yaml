    name: simplecvtool-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://dcobmfocksjbbthsdnbh.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjb2JtZm9ja3NqYmJ0aHNkbmJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNjg2MjUsImV4cCI6MjExMDg0NDYyNX0.jnCG3qpYkPuVbxkp7tP1q67wpYlnwidUPptPdgTG7iM
      - key: STRIPE_PRICE_ID_PRO
        value: price_1UeH7zBJwgITD16gZ4QyQkgf
      - key: STRIPE_PRICE_ID_PASS
        value: price_1UeH81BJwgITD16ge3ovQev2
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Render demandera ces valeurs lors de la création du Blueprint.
